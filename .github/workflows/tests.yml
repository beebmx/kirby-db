name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code style
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # the `version` field is kept on purpose
      - name: Validate composer.json
        run: composer validate --strict --no-check-version

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  test:
    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        # prefer-lowest installs illuminate/* 10, which triggers deprecation notices on PHP 8.4+
        stability: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, intl, json, libxml, mbstring, openssl, pdo, pdo_sqlite, SimpleXML, zip
          coverage: none

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Execute tests
        run: composer test

  kirby:
    name: Kirby ${{ matrix.kirby }} - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Kirby 6 is covered by the `test` job
        kirby: ['4', '5']
        php: ['8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, intl, json, libxml, mbstring, openssl, pdo, pdo_sqlite, SimpleXML, zip
          coverage: none

      - name: Install dependencies with Kirby ${{ matrix.kirby }}
        run: |
          composer require --dev "getkirby/cms:^${{ matrix.kirby }}.0" --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Execute tests
        run: composer test

  plugins:
    name: ${{ matrix.plugins.name }} - PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.6']
        plugins:
          - name: Blade
            packages: '"beebmx/kirby-blade:^7.0"'
            groups: blade
          - name: Scheduler
            packages: '"beebmx/kirby-scheduler:^2.0"'
            groups: scheduler
          - name: Blade + Scheduler
            packages: '"beebmx/kirby-blade:^7.0" "beebmx/kirby-scheduler:^2.0"'
            groups: blade scheduler

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: ctype, curl, dom, fileinfo, filter, gd, hash, iconv, intl, json, libxml, mbstring, openssl, pdo, pdo_sqlite, SimpleXML, zip
          coverage: none

      # kirby-blade and kirby-scheduler are optional, so they're only installed for this job
      - name: Install dependencies with ${{ matrix.plugins.name }}
        run: |
          composer require --dev ${{ matrix.plugins.packages }} --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Execute tests
        run: composer test

      # the plugin tests are only registered when the plugin is installed,
      # so an empty group means they didn't run
      - name: Ensure the plugin tests ran
        run: |
          for group in ${{ matrix.plugins.groups }}; do
            composer test -- --group="$group" --fail-on-empty-test-suite
          done
